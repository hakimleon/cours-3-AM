<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}canvas{display:block;margin:0}</style></head>
<body><div id="host"></div>
<script type="module">
import * as pdfjsLib from './pdf.min.js';
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';
const params = new URLSearchParams(location.search);
const file = params.get('file');
const pageNum = Number(params.get('page') || '1');
const scale = Number(params.get('scale') || '2');
window.__status = 'loading';
(async () => {
  try {
    const doc = await pdfjsLib.getDocument({ url: file, isEvalSupported: false }).promise;
    window.__pages = doc.numPages;
    const page = await doc.getPage(pageNum);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    canvas.id = 'pagecanvas';
    document.getElementById('host').appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    window.__status = 'ready';
  } catch (e) {
    window.__status = 'error:' + e.message;
  }
})();
</script></body></html>
